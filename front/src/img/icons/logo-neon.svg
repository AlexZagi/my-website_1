<svg xmlns="http://www.w3.org/2000/svg" width="520" height="140" viewBox="0 0 520 140" role="img" aria-label="The Fitness Center">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6bef7b"/>
      <stop offset="1" stop-color="#2d8a4e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.42  0 0 0 0 0.94  0 0 0 0 0.48  0 0 0 0.9 0" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="520" height="140" fill="none"/>

  <!-- Icon (minimal dumbbell) -->
  <g filter="url(#glow)" transform="translate(28,36)">
    <rect x="0" y="18" width="18" height="34" rx="6" fill="url(#g)"/>
    <rect x="18" y="26" width="10" height="18" rx="5" fill="#6bef7b"/>
    <rect x="28" y="31" width="52" height="8" rx="4" fill="#f4fff6" opacity="0.95"/>
    <rect x="80" y="26" width="10" height="18" rx="5" fill="#6bef7b"/>
    <rect x="90" y="18" width="18" height="34" rx="6" fill="url(#g)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(150,44)">
    <text x="0" y="30" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="900" font-size="34" fill="#f4fff6" letter-spacing="1">
      THE
      <tspan fill="url(#g)" filter="url(#glow)" dx="10">FITNESS</tspan>
    </text>
    <text x="0" y="66" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="800" font-size="24" fill="#d9ffe1" letter-spacing="2">
      CENTER
    </text>
  </g>
</svg>
